[project]
name = "satelite-agro-mcp"
version = "0.1.0"
description = "MCP server do Projeto 1 (Satélite + Agro/GIS) — tools de acesso a dado público."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "redis>=5.0",
    "mcp>=2,<3",
    "psycopg[binary]>=3.2",
    "rasterio>=1.3",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
satelite-agro-mcp = "satelite_agro_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satelite_agro_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: teste que faz chamada real à API do Open-Meteo (desabilitado por padrão)",
]
addopts = "-m 'not live'"
