[project]
name = "satelite-agro-ingestion"
version = "0.1.0"
description = "Ingestão e fusão de dado público (MapBiomas, IBGE) do Projeto 1. Determinístico, sem LLM."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "rasterio>=1.3",
    "pypdf>=5.0",
]

[project.scripts]
satelite-agro-ingestion = "satelite_agro_ingestion.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satelite_agro_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: teste que exige um Postgres real (desabilitado por padrão)",
]
addopts = "-m 'not db'"
