[project]
name = "satelite-agro-agent"
version = "0.1.0"
description = "Agente do Projeto 1 (Satélite + Agro/GIS) — LangGraph + Gemini, consome as tools via MCP."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1,<2",
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-google-genai>=4.3,<5",
    "langchain-mcp-adapters>=0.3,<0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "mlflow-skinny>=2.19,<3",
]

[project.scripts]
satelite-agro-agent = "satelite_agro_agent.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satelite_agro_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: chamada real ao modelo e ao MCP server (desabilitado por padrão)",
]
addopts = "-m 'not live'"
